services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your shell for the local proxy}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_BASE_URL: http://host.docker.internal:4000/v1
      DATABASE_PATH: /app/data/chat.sqlite
      CONVERSATION_TOKEN_BUDGET: ${CONVERSATION_TOKEN_BUDGET:-32000}
      HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-40}
      HISTORY_MAX_BYTES: ${HISTORY_MAX_BYTES:-65536}
      HISTORY_TTL_SECONDS: ${HISTORY_TTL_SECONDS:-86400}
      HISTORY_MAX_CONVERSATIONS: ${HISTORY_MAX_CONVERSATIONS:-1000}
    volumes:
      - chat-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  chat-data:
